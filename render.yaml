services:
  - type: web
    name: cleanlink
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cleanlink-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"

databases:
  - name: cleanlink-db
    databaseName: cleanlink
    user: cleanlink
    plan: free
